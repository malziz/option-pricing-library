
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option-pricing-library"
version = "0.1.0"
description = "A modular Python library for quantitative option pricing"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
